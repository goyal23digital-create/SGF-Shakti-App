name: sgf_shakti
description: SGF Shakti — a premium B2B Dealer Growth Platform for a plastic furniture manufacturer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management — simple, dependable, no code-gen.
  provider: ^6.1.2

  # Declarative routing with a persistent bottom-nav shell.
  go_router: ^14.2.0

  # Premium typography.
  google_fonts: ^6.2.1

  # Formatting (currency, dates, numbers).
  intl: ^0.19.0

  # --- Firebase (wired in repositories layer; see docs/ARCHITECTURE.md).
  # Uncomment when connecting a real backend. Mock repositories run offline today.
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_messaging: ^15.0.4
  # firebase_storage: ^12.1.3
  # cloud_functions: ^5.0.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # No bundled image assets — the app renders premium gradient/icon
  # placeholders so it runs fully offline. Drop real assets here later:
  # assets:
  #   - assets/images/
